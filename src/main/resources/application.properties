spring.application.name=api-gateway-grupo11
server.port=8070

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=solicitud-service-grupo11
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SOLICITUD-SERVICE-GRUPO11
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/solicitudes/**

spring.cloud.gateway.server.webflux.routes[1].id=evaluacion-service-grupo11
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EVALUACION-SERVICE-GRUPO11
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/evaluaciones/**